<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="stt std">
<title id="stt">Subhajit's tech stack</title><desc id="std">Ten labelled technologies on three tilted orbits, with the same stack grouped into chips.</desc>
<defs><style>.std{font-family:"Bebas Neue","Oswald","Arial Narrow",Impact,"Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:.5px}
.sts{font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.stm{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.stchip{animation:stpop .5s ease-out both}
